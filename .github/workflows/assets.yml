name: assets

# Rebuilds the header and stack SVGs whenever the generator changes,
# so editing scripts/generate.py on github.com is enough.
on:
  push:
    branches: [main]
    paths: [scripts/generate.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: regenerate profile assets"
          git push
